<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/CreatePost.css">
    <title>Create New Post - Forum</title>
</head>
<body>
    {{if .ErrorMsg}}
    <div style="position: fixed; top: 20px; right: 20px; background: #ef4444; color: white; padding: 20px; border-radius: 10px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span>⚠️</span>
            <span>{{.ErrorMsg}}</span>
            <a href="/create-post-page" style="color: white; text-decoration: none; margin-left: 10px; font-weight: bold;">[×]</a>
        </div>
    </div>
    {{end}}

    <div class="container">
        <div class="header">
            <h1>Create New Post</h1>
            <a href="/communication" class="back-btn">← Back to Forum</a>
        </div>

        {{if .CategoryError}}
        <div class="error-message">
            <p>{{.CategoryError}}</p>
        </div>
        {{end}}

        <div class="create-post-form">
            <form action="/create-post" method="POST">
                <div class="form-group">
                    <label for="title">Post Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter your post title..." 
                           value="{{.FormData.Title}}" maxlength="20" required>
                    <small class="char-limit-info">Maximum 20 characters</small>
                </div>

                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" placeholder="What's on your mind? Share your thoughts..." 
                              maxlength="50" required>{{.FormData.Content}}</textarea>
                    <small class="char-limit-info">Maximum 50 characters</small>
                </div>

                <div class="form-group">
                    <label>Select Categories</label>
                    <div class="categories">
                        {{range .Categories}}
                        <label class="category-item">
                            <input type="checkbox" id="cat_{{.ID}}" name="categories" value="{{.ID}}"
                                {{range $.FormData.SelectedCategories}}{{if eq . (printf "%d" $.ID)}}checked{{end}}{{end}}>
                            <span>{{.Name}}</span>
                        </label>
                        {{end}}
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Create Post</button>
                    <a href="/communication" class="cancel-btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
