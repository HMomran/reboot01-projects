<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request - Groupie Tracker</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --warning-color: #ff9f1c;
            --background-color: #f8f9fa;
            --text-color: #333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        
        .error-container {
            max-width: 600px;
            padding: 2rem;
            border-radius: 10px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .error-code {
            font-size: 5rem;
            font-weight: bold;
            color: var(--warning-color);
            margin: 0;
            line-height: 1;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: var(--secondary-color);
        }
        
        .error-description {
            margin-bottom: 2rem;
            color: #666;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background-color: var(--secondary-color);
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        
        .btn-outline:hover {
            background-color: rgba(74, 111, 165, 0.1);
        }
        
        .music-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        @media (max-width: 600px) {
            .error-container {
                width: 90%;
                padding: 1.5rem;
            }
            
            .error-code {
                font-size: 3.5rem;
            }
            
            .error-message {
                font-size: 1.25rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="music-icon">🎸</div>
        <h1 class="error-code">400</h1>
        <h2 class="error-message">Bad Request</h2>
        <p class="error-description">
            The server couldn't understand your request. Please check the URL or parameters and try again.
        </p>
        <div class="action-buttons">
            <a href="/" class="btn">Return Home</a>
            <button onclick="history.back()" class="btn btn-outline">Go Back</button>
        </div>
    </div>
</body>
</html>
