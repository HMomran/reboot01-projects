<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Groupie Tracker</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --background-color: #f8f9fa;
            --text-color: #333;
            --error-color: #e63946;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        
        .error-container {
            max-width: 600px;
            padding: 2rem;
            border-radius: 10px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .error-code {
            font-size: 5rem;
            font-weight: bold;
            color: var(--error-color);
            margin: 0;
            line-height: 1;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: var(--secondary-color);
        }
        
        .error-description {
            margin-bottom: 2rem;
            color: #666;
        }
        
        .home-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-weight: 500;
        }
        
        .home-link:hover {
            background-color: var(--secondary-color);
        }
        
        .music-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        @media (max-width: 600px) {
            .error-container {
                width: 90%;
                padding: 1.5rem;
            }
            
            .error-code {
                font-size: 3.5rem;
            }
            
            .error-message {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="music-icon">🎵</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Oops! Page Not Found</h2>
        <p class="error-description">
            The artist or page you're looking for doesn't exist or has moved.
            Let's get you back to the music!
        </p>
        <a href="/" class="home-link">Return to Groupie Tracker</a>
    </div>
</body>
</html>
